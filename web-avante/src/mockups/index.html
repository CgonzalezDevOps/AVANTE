<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AVANTE</title>
    <link rel="stylesheet" href="../styles/svg.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .login-container label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .login-container input[type="text"],
        .login-container input[type="password"] {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .login-container button {
            width: 100%;
            padding: 0.7rem;
            background: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }

        .login-container button:hover {
            background: #0056b3;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <h2>Iniciar Sesión</h2>
        <form>
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" required>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Entrar</button>
        </form>
    </div>
    <style>
        /* Botón flotante de WhatsApp */
        .whatsapp-float {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            width: 64px;
            height: 64px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            border-radius: 10%;
            transition: box-shadow 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .whatsapp-float:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
        }

        /* Sobrescribir tamaño solo para el botón flotante */
        .whatsapp-float .icon-whatsapp {
            width: 64px;
            height: 64px;
            font-size: 64px; /* Para que 1em = 64px */
        }
    </style>
    <a href="https://wa.me/50377772397" target="_blank" class="whatsapp-float" aria-label="WhatsApp">
        <div class="icon-whatsapp"></div>
    </a>
</body>

</html>
